plugins {
  id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

base {
  archivesName = "${project.mod_id}-common-${project.minecraft_version}"
}

minecraft {
  version(minecraft_version)
  runs {
    server('vanilla_server') {
      workingDirectory(this.file("run"))
    }
    client('vanilla_client') {
      workingDirectory(this.file("run"))
    }
  }
}

dependencies {
  compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'

  addEasyNpcDependency(dependencies, 'compileOnly', 'common')

  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
  useJUnitPlatform()
}

configurations.all {
  resolutionStrategy {
    cacheDynamicVersionsFor 0, 'seconds'
    cacheChangingModulesFor 0, 'seconds'
  }
}

processResources {

  def buildProps = project.properties.clone()

  filesMatching(['pack.mcmeta']) {
    expand buildProps
  }
}
