tasks.register('runAllGameTests') {
  group = 'verification'
  description = 'Runs both Fabric and Forge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer'
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(17)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenLocal()
    mavenCentral()
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
  }

  ext {
    localMavenPackageExists = { String group, String name, String version ->
      def groupPath = group.replace('.', '/')
      def localRepoPath = repositories.mavenLocal().url.path
      def packagePath = new File("${localRepoPath}/${groupPath}/${name}/${version}")
      return packagePath.exists()
    }

    addEasyNpcDependency = { dependencies, configName, String platform = 'common' ->
      def easyNpcVersion = project.hasProperty('easy_npc_version') ? project.easy_npc_version : project.version
      def easyNpcArtifact = "easy_npc-${platform}-${project.minecraft_version}"
      def useLocal = localMavenPackageExists('de.markusbordihn.easynpc', easyNpcArtifact, easyNpcVersion)

      if (useLocal) {
        logger.lifecycle("Using local Easy NPC ${platform}: ${easyNpcVersion}")
        def localDep = "de.markusbordihn.easynpc:${easyNpcArtifact}:${easyNpcVersion}"

        if (platform == 'forge' && project.hasProperty('fg')) {
          dependencies."${configName}"(fg.deobf(localDep)) {
            changing = true
          }
        } else {
          dependencies."${configName}"(localDep) {
            changing = true
          }
        }
      } else {
        def curseProperty = platform == 'fabric' ? 'fabric_easy_npc_core' : 'forge_easy_npc_core'
        if (project.hasProperty(curseProperty) && project.property(curseProperty)) {
          logger.lifecycle("Local Easy NPC not found, using CurseForge: ${project.property(curseProperty)}")
          def curseDep = "curse.maven:easy_npc_core-1308987:${project.property(curseProperty)}"

          if (platform == 'forge' && project.hasProperty('fg')) {
            dependencies."${configName}"(fg.deobf(curseDep))
          } else {
            dependencies."${configName}"(curseDep)
          }
        } else {
          logger.warn("WARNING: No Easy NPC dependency available for ${platform}")
        }
      }
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.ALL
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}
}
